            const methodIcons = {
                pix: 'fa-qrcode',
                cashapp: 'fa-dollar-sign',

                crypto: 'fa-coins',
                paypal: 'fa-paypal',
                giftcard: 'fa-gift'
            };

            function isVideoUrl(url) {
                if (!url) return false;
                const ext = ['.mp4', '.webm', '.mov', '.avi', '.mkv', '.ogg'];
                return ext.some(e => url.toLowerCase().includes(e));
            }

            function openTelegramDM(message) {
                const encoded = encodeURIComponent(message);
                const link = `https://t.me/${TELEGRAM_USERNAME}?text=${encoded}`;
                window.open(link, '_blank');
            }

            const grid = document.getElementById('productGrid');
            const carouselTrack = document.getElementById('carouselTrack');

            function renderCarousel() {
                if (!carouselTrack) return;
                let html = '';
                products.slice(0, 15).forEach(p => {
                    html += `
                        <div class="carousel-item" data-preview='${JSON.stringify({name:p.name, url:p.preview})}'>
                            <img src="${p.image}.html" alt="${p.name}" loading="lazy"
                                 onerror="this.style.backgroundColor='#eaeef9'; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22 viewBox=%220 0 400 300%22%3E%3Crect width=%22400%22 height=%22300%22 fill=%22%23f0f3fc%22/%3E%3Ctext x=%2220%22 y=%22150%22 font-family=%22Inter%22 font-size=%2216%22 fill=%22%234a4566%22%3ENo Image%3C/text%3E%3C/svg%3E';" />
                            <div class="carousel-overlay">${p.name}</div>
                        </div>
                    `;
                });
                carouselTrack.innerHTML = html + html;
                startAutoScroll();
            }

            let autoScrollInterval;
            function startAutoScroll() {
                if (!carouselTrack) return;
                let scrollPos = 0;
                clearInterval(autoScrollInterval);
                autoScrollInterval = setInterval(() => {
                    scrollPos += 1;
                    carouselTrack.scrollLeft = scrollPos;
                    if (scrollPos >= carouselTrack.scrollWidth / 2) {
                        scrollPos = 0;
                        carouselTrack.scrollLeft = 0;
                    }
                }, 30);
            }

            function renderProducts() {
                if (!grid) return;
                let html = '';
                products.forEach(p => {
                    const priceFmt = p.price.toFixed(2);
                    const previewBtn = (p.preview && p.preview.trim() !== '') ?
                        `<button class="btn btn-preview" data-preview='${JSON.stringify({name:p.name, url:p.preview})}'><i class="fas fa-eye"></i> Preview</button>` :
                        '';

                    html += `
                <div class="product-card" data-product-id="${p.id}">
                  <div class="card-content">
                    <div class="img-wrapper">
                      <img src="${p.image}.html" alt="${p.name}" loading="lazy"
                           onerror="this.style.backgroundColor='#eaeef9'; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22 viewBox=%220 0 400 300%22%3E%3Crect width=%22400%22 height=%22300%22 fill=%22%23f0f3fc%22/%3E%3Ctext x=%2220%22 y=%22150%22 font-family=%22Inter%22 font-size=%2216%22 fill=%22%234a4566%22%3EImage not found%3C/text%3E%3C/svg%3E';" />

                      ${p.name}
                      <span class="price">$${priceFmt}</span>
                    </div>
                    <p class="description">${p.description}</p>
                    <div class="action-group">
                      ${previewBtn}
                      <button class="btn btn-buy" data-buy='${JSON.stringify({id:p.id, name:p.name, price:p.price})}'>
                        <i class="fas fa-bolt"></i> Buy now
                      </button>
                    </div>
                  </div>
                </div>
              `;
                });
                grid.innerHTML = html;
            }

            renderProducts();

            const previewModal = document.getElementById('previewModal');
            const previewTitle = document.getElementById('modalTitle');
            const previewContent = document.getElementById('previewContent');
            const closePreview = document.getElementById('closePreviewBtn');

            function openPreview(data) {
                if (!data || !data.url) return;
                previewTitle.textContent = data.name || 'Preview';
                previewContent.innerHTML = '';
                const url = data.url;
                if (isVideoUrl(url)) {
                    const video = document.createElement('video');
                    video.src = url;
                    video.controls = true;
                    video.autoplay = true;
                    video.muted = false;
                    video.loop = false;
                    video.style.width = '100%';
                    video.style.borderRadius = '24px';
                    previewContent.appendChild(video);
                } else {
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = data.name || 'Preview';
                    img.loading = 'lazy';
                    img.onerror = () => {
                        img.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22 viewBox=%220 0 400 300%22%3E%3Crect width=%22400%22 height=%22300%22 fill=%22%23eaeef9%22/%3E%3Ctext x=%2220%22 y=%22150%22 font-family=%22Inter%22 font-size=%2216%22 fill=%22%234a4566%22%3EPreview not available%3C/text%3E%3C/svg%3E';
                    };
                    previewContent.appendChild(img);
                }
                previewModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closePreviewModal() {
                previewModal.classList.remove('active');
                document.body.style.overflow = '';
                const v = previewContent.querySelector('video');
                if (v) { v.pause(); v.currentTime = 0; }
            }

            const closeBuyBtn = document.getElementById('closeBuyBtn');

            let buyView = 'options';

            const cryptoNetworks = [
                { name: 'Bitcoin (BTC)', icon: 'fa-btc' },
                { name: 'Ethereum (ETH)', icon: 'fa-ethereum' },
                { name: 'USDT (ERC20)', icon: 'fa-coins' },
                { name: 'USDT (TRC20)', icon: 'fa-coins' },
                { name: 'Litecoin (LTC)', icon: 'fa-coins' },
                { name: 'Dogecoin (DOGE)', icon: 'fa-dog' },
                { name: 'BNB (BSC)', icon: 'fa-cube' },
                { name: 'XRP', icon: 'fa-circle' },
            ];

            function renderBuyModal(product, view = 'options') {
                currentBuyProduct = product;
                buyView = view;
                const priceFmt = product.price.toFixed(2);
                let html = '';

                html += `
              <div class="buy-product-info">

                    <i class="fas fa-dollar-sign"></i>
                    <span class="option-label">💰 CashApp</span>
                    <span class="option-arrow"><i class="fas fa-chevron-right"></i></span>
                  </button>
                  <button class="payment-option-btn" data-method="paypal">
                    <i class="fab fa-paypal"></i>
                    <span class="option-label">💸 PayPal</span>
                    <span class="option-arrow"><i class="fas fa-chevron-right"></i></span>
                  </button>
                  <button class="payment-option-btn" data-method="giftcard">
                    <i class="fas fa-gift"></i>
                    <span class="option-label">🎁 Gift Card</span>
                    <span class="option-arrow"><i class="fas fa-chevron-right"></i></span>
                  </button>
                  <button class="payment-option-btn" data-method="crypto">
                    <i class="fas fa-coins"></i>
                    <span class="option-label">₿ Crypto</span>
                    <span class="option-arrow"><i class="fas fa-chevron-right"></i></span>
                  </button>
                  <button class="payment-option-btn" data-method="card">
                    <i class="fas fa-credit-card"></i>
                    <span class="option-label">💳 Card / Bank</span>
                    <span class="option-arrow"><i class="fas fa-chevron-right"></i></span>
                  </button>
                  <button class="payment-option-btn" data-method="applepay">
                    <i class="fab fa-apple-pay"></i>
                    <span class="option-label">🍏 Apple Pay</span>
                    <span class="option-arrow"><i class="fas fa-chevron-right"></i></span>
                  </button>
                  <button class="payment-option-btn" data-method="googlepay">
                    <i class="fab fa-google-pay"></i>
                    <span class="option-label">🍀 Google Pay</span>
                    <span class="option-arrow"><i class="fas fa-chevron-right"></i></span>
                  </button>
                </div>
                <div style="margin-top: 0.8rem; font-size:0.8rem; color:#5a4e7a; text-align:center; opacity:0.7;">
                  <i class="fas fa-lock" style="margin-right:4px;"></i> All payments are securely processed via Telegram DM
                </div>
              `;
                } else if (view === 'crypto') {
                    let netHtml = '';
                    cryptoNetworks.forEach(net => {
                        netHtml += `
                  <div class="network-item" data-network="${net.name}">
                    <i class="fab ${net.icon}"></i>
                    ${net.name}
                  </div>
                `;
                    });
                    html += `
                <div class="giftcard-section">
                  <div class="gc-title"><i class="fas fa-coins" style="color:#6d5f9e;"></i> Choose your Crypto Network</div>
                  <div class="network-grid">${netHtml}</div>
                  <button class="back-to-options" id="backToOptions"><i class="fas fa-arrow-left"></i> Back</button>
                </div>
              `;
                } else {
                    const methodLabels = {
                        pix: 'Pix',
                        cashapp: 'CashApp',
                        paypal: 'PayPal',
                        giftcard: 'Gift Card',
                        card: 'Card / Bank',
                        applepay: 'Apple Pay',
                        googlepay: 'Google Pay'
                    };
                    const method = view;
                    const label = methodLabels[method] || method;
                    const iconClass = methodIcons[method] || 'fa-credit-card';
                    const msg =
                        `Hello! I'm interested in buying *${product.name}* for $${priceFmt}. I would like to pay with *${label}*. Please send me the payment details. Thank you!`;

                    html += `
                <div class="dm-proof-section">
                  <div class="dm-info">
                    <i class="fas fa-info-circle" style="color:#6d5f9e; margin-right:6px;"></i>
                    You will be redirected to Telegram with a pre-filled message.<br />
                    <strong>@${TELEGRAM_USERNAME}</strong> – we'll respond with payment instructions.
                  </div>
                  <button class="btn-dm" id="confirmMethodBtn">
                    <i class="fas ${iconClass}"></i> Proceed with ${label}
                  </button>
                  <button class="back-to-options" id="backToOptions"><i class="fas fa-arrow-left"></i> Back</button>
                  <div style="margin-top:0.6rem; font-size:0.75rem; color:#5a4e7a; opacity:0.6; text-align:center;">
                    <i class="fas fa-clock"></i> Pre-filled message – just send!
                  </div>
                </div>
              `;
                }

                buyModalBody.innerHTML = html;

                if (view === 'options') {
                    const btns = buyModalBody.querySelectorAll('.payment-option-btn[data-method]');
                    btns.forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const method = this.dataset.method;
                            if (method === 'crypto') {
                                if (currentBuyProduct) renderBuyModal(currentBuyProduct, 'crypto');
                            } else {
                                if (currentBuyProduct) renderBuyModal(currentBuyProduct, method);
                            }
                        });
                    });
                } else if (view === 'crypto') {
                    const netItems = buyModalBody.querySelectorAll('.network-item');
                    netItems.forEach(item => {
                        item.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const network = this.dataset.network;
                            if (currentBuyProduct) {
                                const priceFmt = currentBuyProduct.price.toFixed(2);
                                const msg =
                                    `Hello! I'm interested in buying *${currentBuyProduct.name}* for $${priceFmt}. I would like to pay with *Crypto* using network: *${network}*. Please send me the wallet address. Thank you!`;
                                openTelegramDM(msg);
                                closeBuyModal();
                            }
                        });
                    });
                } else {
                    const confirmBtn = document.getElementById('confirmMethodBtn');
                    const backBtn = document.getElementById('backToOptions');
                    if (confirmBtn) {
                        confirmBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            if (currentBuyProduct) {
                                const priceFmt = currentBuyProduct.price.toFixed(2);
                                const methodLabels = {
                                    pix: 'Pix',
                                    cashapp: 'CashApp',
                                    paypal: 'PayPal',
                                    giftcard: 'Gift Card',
                                    card: 'Card / Bank',
                                    applepay: 'Apple Pay',
                                    googlepay: 'Google Pay'
                                };
                                const label = methodLabels[buyView] || buyView;
                                const msg =
                                    `Hello! I'm interested in buying *${currentBuyProduct.name}* for $${priceFmt}. I would like to pay with *${label}*. Please send me the payment details. Thank you!`;
                                openTelegramDM(msg);
                                closeBuyModal();
                            }
                        });
                    }
                    if (backBtn) {
                        backBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            if (currentBuyProduct) renderBuyModal(currentBuyProduct, 'options');
                        });
                    }
                }
            }

            function openBuyModal(product) {
                if (!product) return;
                document.getElementById('buyModalTitle').textContent = '💎 Complete your purchase';
                renderBuyModal(product, 'options');
                buyModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeBuyModal() {
                buyModal.classList.remove('active');
                document.body.style.overflow = '';
                currentBuyProduct = null;
                buyView = 'options';
            }

            document.addEventListener('click', function(e) {
                const previewBtn = e.target.closest('.btn-preview');
                if (previewBtn) {
                    e.preventDefault();
                    const dataAttr = previewBtn.getAttribute('data-preview');
                    if (dataAttr) {
                        try { openPreview(JSON.parse(dataAttr)); } catch (_) {}
                    }
                    return;
                }

                const buyBtn = e.target.closest('.btn-buy');
                if (buyBtn) {
                    e.preventDefault();
                    const dataAttr = buyBtn.getAttribute('data-buy');
                    if (dataAttr) {
                        try {
                            const prodData = JSON.parse(dataAttr);
                            const fullProduct = products.find(p => p.id === prodData.id);
                            if (fullProduct) {
                                openBuyModal(fullProduct);
                            } else {
                                openBuyModal(prodData);
                            }
                        } catch (_) {}
                    }
                    return;
                }

                if (e.target === previewModal) closePreviewModal();
                if (e.target === buyModal) closeBuyModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (previewModal.classList.contains('active')) closePreviewModal();
                    if (buyModal.classList.contains('active')) closeBuyModal();
                }
            });

            closePreview.addEventListener('click', closePreviewModal);
            closeBuyBtn.addEventListener('click', closeBuyModal);

            console.log('✨ ÆON store loaded · Light Theme with Highlights');
        })();
    </script>
